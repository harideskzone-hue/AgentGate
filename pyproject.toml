[project]
name = "agentgate"
version = "0.1.0"
description = "AgentGate project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
